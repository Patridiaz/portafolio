<section class="contact">
  <div class="container">
    <h2>Contáctame</h2>
    <p class="description">Si tienes alguna pregunta o deseas colaborar, no dudes en enviarme un mensaje.</p>

    <form class="contact-form" (submit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="name">Tu nombre</label>
        <input type="text" id="name" placeholder="Nombre completo" required />
      </div>

      <div class="form-group">
        <label for="email">Tu email</label>
        <input type="email" id="email" placeholder="ejemplo@email.com" required />
      </div>

      <div class="form-group">
        <label for="message">Mensaje</label>
        <textarea id="message" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
      </div>

      <button type="submit">Enviar mensaje</button>
    </form>
  </div>
</section>
